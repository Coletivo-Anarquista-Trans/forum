name: Rust Clippy Lint

on:
  push:
    branches: [main, tauri-dioxus]
  pull_request:
    branches: [main, tauri-dioxus]

jobs:
  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Rust
        uses: actions/setup-rust@v1
        with:
          rust-version: 'stable'  # or the specific version you want

      - name: Install Clippy
        run: rustup component add clippy

      - name: Run Clippy
        run: cargo clippy -- -D warnings
