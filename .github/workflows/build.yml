name: Build Android and Windows Desktop App

on:
  push:
    tags:
      - 'v*'

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup linux dev
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            openssl

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          override: true

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://download.oracle.com/java/23/latest/jdk-23_linux-x64_bin.deb
          sudo dpkg -i jdk-23_linux-x64_bin.deb
          wget https://dl.google.com/android/repository/commandlinetools-linux-7302050_latest.zip -O sdk-tools.zip
          unzip sdk-tools.zip -d $HOME/android-sdk-temp
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          mv $HOME/android-sdk-temp/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-30" "build-tools;30.0.3" "ndk;28.0.13004108"
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH:$HOME/android-sdk/ndk/28.0.13004108

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli

      - name: Bundle Android App
        run: |
          export ANDROID_NDK_HOME=$HOME/android-sdk/ndk/28.0.13004108
          cargo clean
          dx bundle --platform android --no-default-features --release

      - name: Rename Android Bundle
        run: mv -f dist/*.aab dist/app-android-${{ github.ref_name }}.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android APK
          path: dist/app-android-${{ github.ref_name }}.aab

  build_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli

      - name: Build
        run: dx bundle --platform desktop --release

      - name: Rename Windows Executable
        run: mv -f dist/*.exe dist/app-windows-${{ github.ref_name }}.exe

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: Windows EXE
          path: dist/app-windows-${{ github.ref_name }}.exe

  create_release:
    runs-on: ubuntu-latest
    needs: [build_android, build_windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/app-android-${{ github.ref_name }}.aab
            dist/app-windows-${{ github.ref_name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
